[package]
name = "imagegen"
version = "2.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["okooo5km(十里)"]
description = "Portable APIMart image generation CLI and Agent Skill"
license = "Apache-2.0"
repository = "https://github.com/okooo5km/imagegen"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::images"]
keywords = ["imagegen", "apimart", "ai", "cli"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
